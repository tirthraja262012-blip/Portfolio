<style>

.logotext{text-align:center;font-weight:800;color:#7C2D12;margin-bottom:8px}
.card{background:#fff;padding:12px;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 4px #0001}
.top{background:#111;color:#fff;padding:14px;border-radius:12px;margin-bottom:12px;line-height:1.6;font-weight:700}
.diffbox{background:#FFF7ED;border:2px solid #F59E0B;padding:14px;border-radius:12px;margin-bottom:12px;text-align:center}
.diffbox .big{font-size:26px;font-weight:800;color:#15803D}
input{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:15px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#0b5cff;color:#fff;font-size:16px;font-weight:700;margin-bottom:8px}
.small{font-size:13px;color:#555}
.del{background:#ff3b30;margin-top:8px}
.row{display:flex;gap:8px}.row button{flex:1}
.update{background:#0a7a42}.excel{background:#107c41}
.up{color:#15803D;font-weight:700}.down{color:#DC2626;font-weight:700}
.filterbox{background:#fff;padding:12px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px #0001;border:2px solid #0b5cff}
.filterbox label{font-weight:800;font-size:15px}
.filterbox select{width:100%;padding:12px;margin-top:8px;border:2px solid #0b5cff;border-radius:8px;font-size:16px;font-weight:700;background:#E8EEFF}
.filterbox .clearbtn{background:#555;margin-top:8px;margin-bottom:0}
.groupbox{background:#E8EEFF;border:2px solid #0b5cff;padding:14px;border-radius:12px;margin-bottom:12px;text-align:center;display:none}
.groupbox .gtitle{font-size:16px;font-weight:800;color:#0b5cff}
.groupbox .gbig{font-size:20px;font-weight:800;line-height:1.6}
</style>
</head>
<body>
<img src="logo.png" class="logo">
<div class="logotext">MF Investment - જય સ્વામિનારાયણ</div>
<h1>📊 મારો પોર્ટફોલિયો V3.5</h1>
<div class="top" id="total"></div>
<div class="diffbox" id="diffBox">
<div style="font-size:14px;color:#7C2D12;font-weight:700">જય સ્વામિનારાયણ - ગઈકાલ કરતાં આજે કેટલો ફરક?</div>
<div class="big" id="diffTotal">હજુ અપડેટ નથી કર્યું</div>
<div class="small" id="diffSub">લીલું બટન દબાવો એટલે ફરક અહીં આવી જશે</div>
</div>
<button class="update" onclick="updateAllNAV()">🔄 ઓટો અપડેટ - તાજો NAV લાવો</button>
<p class="small" id="status" style="text-align:center">અપડેટ માટે ઇન્ટરનેટ જોઈએ.</p>
<div class="filterbox">
<label>🔍 સ્કીમ પસંદ કરો - અહીંથી ક્લિક કરો</label>
<select id="schemeSelect" onchange="onSchemeChange()">
<option value="all">-- બધી સ્કીમ જુઓ --</option>
</select>
<button class="clearbtn" onclick="showAllSchemes()">↩️ બધી સ્કીમ પાછી બતાવો</button>
</div>
<div class="groupbox" id="groupBox">

<div class="gbig" id="groupTotal"></div>
<div class="small" id="groupSub"></div>
</div>

<input id="name" placeholder="સ્કીમનું નામ">
<input id="folio" placeholder="ફોલિયો / માલિક">
<input id="units" type="number" placeholder="Units">
<input id="inv" type="number" placeholder="Invested ₹">
<input id="nav" type="number" placeholder="NAV">
<button onclick="addFund()">Add Fund</button>
</div>
<div class="row">
<button class="excel" onclick="exportExcel()">📗 Excel માં Export કરો</button>
<button onclick="exportData()">💾 બેકઅપ લો</button>
</div>
<div class="row">
<button onclick="document.getElementById('file').click()" style="background:#555">બેકઅપ પાછો લાવો</button>
</div>
<input type="file" id="file" hidden onchange="importData(event)">
<div id="list" style="margin-top:12px"></div>
